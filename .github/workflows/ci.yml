name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup (Bun + caches + install)
        uses: howard86/actions/setup@56841d1894259f87ff5a6551b6ddac457d520b83 # v1.0.2

      - name: Lint (ultracite)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Quality (typos, gitleaks, actionlint)
        uses: howard86/actions/quality@56841d1894259f87ff5a6551b6ddac457d520b83 # v1.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
